[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "assayval"
version = "0.1.0"
description = "In silico PCR assay validation pipeline"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
assay-val = "assayval.cli:main"
assay-design = "assay_design.cli:main"
download-assemblies = "assayval.download_cli:main"

[tool.setuptools]
packages = ["assayval", "assay_design"]

[tool.setuptools.package-dir]
assay_design = "assay-design"
